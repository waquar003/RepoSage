<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Main circular gradient background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2B6CB0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base shape -->
  <circle cx="100" cy="100" r="90" fill="url(#grad1)"/>
  
  <!-- Git branch representation -->
  <path d="M70 60 L70 140 L130 140" 
        stroke="white" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Connection dots -->
  <circle cx="70" cy="60" r="12" fill="white"/>
  <circle cx="70" cy="140" r="12" fill="white"/>
  <circle cx="130" cy="140" r="12" fill="white"/>
  
  <!-- Brain/circuit paths -->
  <path d="M85 80 Q100 60 115 80 Q130 100 115 120" 
        stroke="white" 
        stroke-width="6" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Additional neural connections -->
  <path d="M95 90 Q105 100 95 110" 
        stroke="white" 
        stroke-width="4" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Small decorative dots -->
  <circle cx="105" cy="85" r="4" fill="white"/>
  <circle cx="110" cy="100" r="4" fill="white"/>
  <circle cx="105" cy="115" r="4" fill="white"/>
</svg>
